name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests, SQLite)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: ruff check app tests migrations
      - run: python -m pytest -q

  backend-postgres:
    name: Backend tests on PostgreSQL + pgvector
    runs-on: ubuntu-latest
    # Starts non-blocking until it has been green once on your repo; remove continue-on-error afterwards.
    continue-on-error: true
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: supplychain }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/supplychain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      E2E_APPROVER_KEY: e2e-approver-key-0123456789
      E2E_VIEWER_KEY: e2e-viewer-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - name: Start backend
        working-directory: backend
        env:
          API_KEYS: alice:e2e-approver-key-0123456789:approver,vic:e2e-viewer-key-0123456789:viewer
          WEBHOOK_SECRET: e2e-webhook-secret
          MONTE_CARLO_RUNS: "2000"
          CORS_ORIGINS: http://localhost:3000
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: Build and start frontend
        working-directory: frontend
        env: { API_URL: "http://localhost:8000" }
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup sh -c 'cp -r .next/static .next/standalone/.next/static && PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js' > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000 >/dev/null && break; sleep 1; done
      - name: Install browsers and run e2e
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        run: tail -n 100 backend.log frontend.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ./frontend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Validate compose file
        run: |
          printf 'POSTGRES_PASSWORD=x\nREDIS_PASSWORD=y\nAPI_KEYS=a:0123456789abcdef:admin\nWEBHOOK_SECRET=z\n' > .env
          docker compose config -q
