# Production-style stack. Secrets come from .env (see .env.example) - compose refuses to start without them.
# Only the frontend and API are published, and by default only on 127.0.0.1: put a TLS reverse proxy
# (Caddy/nginx/Traefik) in front. Postgres and Redis are reachable only on the internal network.
services:
  postgres:
    # PostgreSQL 16 with TimescaleDB and pgvector preinstalled
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: supplychain
    volumes: [pgdata:/home/postgres/pgdata]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplychain"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/supplychain
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_KEYS: ${API_KEYS:?set API_KEYS in .env (name:key:role,...)}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ALLOW_ADMIN_RESET: ${ALLOW_ADMIN_RESET:-false}
      LOG_FORMAT: json
      RUN_EMBEDDED_WORKER: "false"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    # RUN_EMBEDDED_WORKER=false: agents run in the dedicated worker service(s) below
    ports: ["${BIND_ADDRESS:-127.0.0.1}:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 10s
      retries: 30

  worker:
    # LangGraph agent workers consuming the Redis stream; scale with `docker compose up -d --scale worker=3`
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      <<: *backend-env
      WORKER_METRICS_PORT: "9101"
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Read at runtime by the Next.js server and handed to the browser; no rebuild needed per environment.
      API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
