services:
  postgres:
    # PostgreSQL 16 with TimescaleDB and pgvector preinstalled
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplychain
    ports: ["5432:5432"]
    volumes: [pgdata:/home/postgres/pgdata]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplychain"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/supplychain
      REDIS_URL: redis://redis:6379/0
      RUN_EMBEDDED_WORKER: "false"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 30

  worker:
    # LangGraph agent workers consuming the Redis stream; scale with `docker compose up --scale worker=3`
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
